<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The app is dark-only, so the theme colour and colour-scheme are declared up
      front. Without `color-scheme: dark` the browser paints white form controls
      and a white scrollbar over a dark page.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0912" />
    <meta
      name="description"
      content="Scriptura — Divinetalk's internal AI blog automation tool. Generate, edit and publish SEO-optimised content at scale."
    />
    <!-- Internal tool: keep it out of search results entirely. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Scriptura — Divinetalk Content Engine</title>
  </head>
  <body class="bg-void text-ink antialiased">
    <noscript>Scriptura requires JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
