<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The app is dark-only, so the theme colour and colour-scheme are declared up
      front. Without `color-scheme: dark` the browser paints white form controls
      and a white scrollbar over a dark page.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0912" />
    <meta
      name="description"
      content="Scriptura — Divinetalk's internal AI blog automation tool. Generate, edit and publish SEO-optimised content at scale."
    />
    <!-- Internal tool: keep it out of search results entirely. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Scriptura — Divinetalk Content Engine</title>
    <!--
      Inter — the single typeface for all UI text.
      Preconnect hints eliminate the DNS + TLS roundtrip before the stylesheet
      fires. font-display:swap is set by Google Fonts by default so there is no
      FOIT: text renders in the system fallback immediately and swaps when Inter
      is ready.
      Weights loaded: 400 (body), 500 (medium labels), 600 (headings/semibold).
      Variable font range covers all three in a single file.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-void text-ink antialiased">
    <noscript>Scriptura requires JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
