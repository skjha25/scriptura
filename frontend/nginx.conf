# Static serving for the built React app.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: any path that is not a real file must return index.html,
  # or a hard refresh on /blogs/12/edit would 404 instead of loading the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles are immutable, so they can be cached indefinitely.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html must never be cached, or a returning user gets the old shell
  # pointing at bundle hashes that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # The app is an internal tool and must not be indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:5000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  client_max_body_size 12m;
}
